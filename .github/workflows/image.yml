name: image
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          v=${TAG#v}
          gh release download "$TAG" -p "antresol-server-$v-linux-*.tar.gz"
          for a in amd64 arm64; do
            mkdir -p bin/$a && tar -xzf antresol-server-$v-linux-$a.tar.gz -C bin/$a --strip-components=1
          done
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Antresol Server
            org.opencontainers.image.description=Self-hosted home media server for the Antresol app
          tags: |
            ghcr.io/sidun-av/antresol-server:${{ env.VERSION }}
            ghcr.io/sidun-av/antresol-server:latest
